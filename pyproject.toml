[project]
name = "resultportal"
version = "0.1.0"
description = "Alimzy International School Result Portal — Django REST backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.5",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "dj-database-url>=3.0.1",
    "django-cors-headers>=4.7.0",
    "django-filter>=25.1",
    "drf-nested-routers>=0.95.0",
    "drf-spectacular>=0.28.0",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.4",
    "djangorestframework-stubs>=3.17.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [
    ".git",
    ".venv",
    "staticfiles",
    "media",
    "design",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # function calls in argument defaults are used by DRF
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
